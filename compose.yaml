name: game-ai-harness
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-bookworm}
    environment:
      POSTGRES_USER: harness
      POSTGRES_DB: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      target: runtime
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: harness
      PGDATABASE: harness
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      MODEL_MODE: ${MODEL_MODE:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_PROTOCOL: ${MODEL_PROTOCOL:-json-schema}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      WORLDVIEW_PATH: ${WORLDVIEW_PATH:-mods/qingxi/WORLD.md}
      WORLD_ID: ${WORLD_ID:-wuxia}
      WORLD_VERSION: ${WORLD_VERSION:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    init: true

  postgres-test:
    image: ${POSTGRES_IMAGE:-postgres:18-bookworm}
    profiles: [test]
    environment:
      POSTGRES_USER: harness_test
      POSTGRES_DB: harness_test
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness_test -d harness_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      target: test
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgresql://harness_test:isolated-test-only@postgres-test:5432/harness_test
    depends_on:
      postgres-test:
        condition: service_healthy
    init: true

volumes:
  postgres-data:
